# Render "Blueprint": a free demo server built from this repository (see docs/HOSTING_DEMO.md).
# The passwords are generated by Render: read them in the service's Environment tab.
services:
  - type: web
    name: companytimesheet-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: Bootstrap__AdminUsername
        value: admin
      - key: Bootstrap__AdminPassword
        generateValue: true
      - key: Demo__Password
        generateValue: true
